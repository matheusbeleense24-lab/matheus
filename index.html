<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; padding: 20px; font-family: monospace; overflow-y: auto; z-index: 9999;">
      <h2 style="color: red;">❌ ERRO DE CARREGAMENTO</h2>
      <pre id="error-message" style="background: #f0f0f0; padding: 10px; border-radius: 5px; color: #333;"></pre>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        const overlay = document.getElementById('error-overlay');
        const message = document.getElementById('error-message');
        if (!overlay || !message) return;
        overlay.style.display = 'block';
        message.textContent = 'ERROR: ' + (e.error?.stack || e.message || 'Unknown error');
        console.error('App Error:', e.error);
      });

      window.addEventListener('unhandledrejection', function(e) {
        const overlay = document.getElementById('error-overlay');
        const message = document.getElementById('error-message');
        if (!overlay || !message) return;
        overlay.style.display = 'block';
        message.textContent = 'PROMISE REJECTION: ' + (e.reason?.stack || e.reason || 'Unknown error');
        console.error('Promise Rejection:', e.reason);
      });
    </script>
  </body>
</html>
